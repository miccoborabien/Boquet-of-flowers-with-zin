
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0b17">
<title>Bouquet of Flowers for Kirsten</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0a0b17;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

pre {
    margin: 0;
    font: 700 10px/1 "Courier New", ui-monospace, monospace;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

p {
    margin: .7em;
    font: italic 13px Georgia, serif;
    color: #7a7da6;
}

@media (max-width: 600px) {
    p {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<pre id="a" role="img"
aria-label="Rotating 3D ASCII bouquet of roses, lilac and lily of the valley"></pre>

<p>Kirsten</p>

<script>
"use strict";

// ================================
// CONFIGURATION
// ================================

const W = 100, H = 56, D = 70, SX = 2.9, SY = 1.75;

const rnd = (() => {
    let a = 11;
    return () => {
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
})();

const rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));

const mixc = (a, b, t) => {
    t = Math.max(0, Math.min(1, t));
    return a.map((v, i) => v + (b[i] - v) * t);
};

const nz = v => {
    const l = Math.hypot(...v) || 1;
    return v.map(x => x / l);
};

const ad = (a, b) => a.map((x, i) => x + b[i]);
const sc = (a, s) => a.map(x => x * s);

const cr = (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
];

const bz = (p, c, q, t) =>
    p.map((_, i) =>
        (1 - t) ** 2 * p[i] +
        2 * (1 - t) * t * c[i] +
        t * t * q[i]
    );

const basis = a => {
    const h = Math.abs(a[1]) > .9 ? [1, 0, 0] : [0, 1, 0];
    const u = nz(cr(a, h));
    return [u, cr(a, u)];
};

const pick = a => a[Math.floor(rnd() * a.length)];

const pts = [];

const add = (p, n, rho, c) => {
    pts.push([
        p[0], p[1], p[2],
        n ? n[0] : 0,
        n ? n[1] : 0,
        n ? n[2] : 0,
        rho, c[0], c[1], c[2], n ? 1 : 0
    ]);
};

// ================================
// COLORS
// ================================

const GR = rgb("#3f9a4f");
const GD = rgb("#1f5a35");
const GL = rgb("#8fdc98");
const WH = rgb("#fbfdf4");

const BASE = [0, -5, 0];

// ================================
// FLOWER STEMS
// ================================

const stem = (p, q, rad = .34) => {
    const m = ad(
        sc(ad(p, q), .5),
        [(rnd() - .5) * 1.5, 0, (rnd() - .5) * 1.5]
    );

    const n = Math.ceil(Math.hypot(...ad(q, sc(p, -1))) * 2);

    for (let i = 0; i <= n; i++) {
        add(
            bz(p, m, q, i / n),
            null,
            rad,
            mixc(GD, GR, rnd())
        );
    }
};

// ================================
// ROSES
// ================================

const rose = (c, R, pal) => {
    const a = nz([c[0] * .6, c[1] * .5 + 4, c[2] * .6 + .1]);
    const [u, v] = basis(a);

    stem(BASE, ad(c, sc(a, -1.6)));
    add(ad(c, sc(a, -1.2)), null, R * .5, GR);

    for (let i = 0; i < 620; i++) {
        const t = Math.pow(rnd(), .7);
        const A = rnd() * 6.283;
        const r = R * t;
        const s = (t * 3.4 + A / 6.283) % 1;

        const ly = R * .7 * (1 - t * t) +
            Math.sin(A * 5 + t * 9) * .22 * t;

        const lx = r * Math.cos(A);
        const lz = r * Math.sin(A);

        const nl = [
            1.4 * t * Math.cos(A),
            1,
            1.4 * t * Math.sin(A)
        ];

        const p = ad(c, ad(
            ad(sc(u, lx), sc(a, ly)),
            sc(v, lz)
        ));

        const n = nz(ad(
            ad(sc(u, nl[0]), sc(a, nl[1])),
            sc(v, nl[2])
        ));

        let col = mixc(pal[1], pal[2], t * .8);

        if (s < .2 || t < .12) {
            col = mixc(col, pal[0], .65);
        }

        add(p, n, .75, col);
    }
};

// ================================
// LILACS
// ================================

const lilac = (b, d, len, rad, pal) => {
    const a = nz(d);
    const [u, v] = basis(a);

    stem(BASE, b);
    stem(b, ad(b, sc(a, len * .25)), .3);

    for (let i = 0; i < 560; i++) {
        const s = .15 + .85 * Math.pow(rnd(), .85);
        const A = rnd() * 6.283;

        const off = ad(
            sc(u, Math.cos(A)),
            sc(v, Math.sin(A))
        );

        const r = (rad * Math.pow(1 - s, .8) + .4) *
            Math.sqrt(rnd());

        const p = ad(
            ad(b, sc(a, s * len)),
            sc(off, r)
        );

        add(
            p,
            nz(ad(off, sc(a, .3))),
            .6,
            mixc(pick(pal), rgb("#ffffff"), rnd() * .25)
        );
    }
};

// ================================
// LILY OF THE VALLEY
// ================================

const lily = (p0, c, p2) => {
    for (let t = 0; t <= 1; t += .012) {
        add(
            bz(p0, c, p2, t),
            null,
            .3,
            mixc(GD, GR, rnd())
        );
    }

    let i = 0;

    for (let t = .48; t <= .97; t += .045, i++) {
        const q = bz(p0, c, p2, t);
        const q2 = bz(p0, c, p2, t + .01);

        const tg = nz(ad(q2, sc(q, -1)));
        const sd = nz(cr(tg, [0, 1, 0]));
        const g = i % 2 ? 1 : -1;

        const bp = [
            q[0] + sd[0] * g,
            q[1] - .9,
            q[2] + sd[2] * g
        ];

        const s = 1 - (t - .48) * .8;

        add(
            ad(q, sc(ad(bp, sc(q, -1)), .5)),
            null,
            .22,
            GR
        );

        add(bp, null, .62 * s + .12, WH);

        add(
            ad(bp, [0, -.5 * s, 0]),
            null,
            .5 * s + .1,
            rgb("#dcecd6")
        );
    }
};

// ================================
// LEAVES
// ================================

const leaf = (b, d, L, w) => {
    const a = nz(d);
    const sd = nz(cr(a, [0, 1, 0]));

    let up = nz(cr(sd, a));

    if (up[1] < 0) up = sc(up, -1);

    for (let i = 0; i < 300; i++) {
        const t = rnd();
        const s = rnd() * 2 - 1;
        const ww = w * Math.sin(Math.PI * Math.pow(t, .75)) * s;

        const p = ad(
            ad(b, sc(a, L * t)),
            sc(sd, ww)
        );

        p[1] += Math.abs(ww) * .3 - .035 * (L * t) ** 2 * .5;

        add(
            p,
            nz(ad(up, sc(sd, s * .6))),
            .55,
            Math.abs(s) < .08
                ? GL
                : mixc(GD, GR, rnd() * .7 + t * .3)
        );
    }
};

// ================================
// BOUQUET WRAPPER
// ================================

const KR = rgb("#e3bd86");
const KD = rgb("#8f6b3e");

for (let i = 0; i < 1900; i++) {
    const h = Math.pow(rnd(), .8);
    const A = rnd() * 6.283;
    const cr_ = Math.sin(A * 7);
    const r = (9.5 * (1 - h) + .3) * (1 + .05 * cr_);

    add(
        [r * Math.cos(A), -4.5 - 13 * h, r * Math.sin(A)],
        nz([Math.cos(A), .45, Math.sin(A)]),
        .7,
        mixc(KR, KD, .35 * (cr_ * .5 + .5) + h * .25)
    );
}

// Pink ribbon

const PK = rgb("#ff5c94");
const PD = rgb("#b82b5a");

for (let i = 0; i < 260; i++) {
    const A = rnd() * 6.283;
    const y = -8.7 + (rnd() - .5) * 1.1;
    const r = 6.9;

    add(
        [r * Math.cos(A), y, r * Math.sin(A)],
        nz([Math.cos(A), .2, Math.sin(A)]),
        .55,
        mixc(PD, PK, rnd())
    );
}

[-1, 1].forEach(g => {
    for (let i = 0; i < 110; i++) {
        const x = g * (1.2 + rnd() * 3.2);
        const y = -8.4 + (rnd() - .5) * 2.6 *
            (1 - Math.abs(x) / 5);

        add(
            [x, y, 7.1 + rnd() * .8],
            nz([g * .3, .3, 1]),
            .55,
            mixc(PD, PK, rnd())
        );
    }
});

add([0, -8.7, 7.5], null, .9, rgb("#ffd0e0"));

// ================================
// LEAVES
// ================================

for (let k = 0; k < 9; k++) {
    const f = k / 9 * 6.283 + rnd() * .3;

    leaf(
        [Math.cos(f) * 2.5, -4.6, Math.sin(f) * 2.5],
        [Math.cos(f) * .85, .5 + rnd() * .2, Math.sin(f) * .85],
        11 + rnd() * 3,
        2.4
    );
}

// ================================
// LILAC FLOWERS
// ================================

const LP = [
    rgb("#8a55c4"),
    rgb("#b57edc"),
    rgb("#c9a0ea"),
    rgb("#dcbdf4")
];

const LQ = [
    rgb("#a98ae0"),
    rgb("#cdb4f0"),
    rgb("#e8dcfa"),
    rgb("#9d6bd6")
];

lilac([-1, -4.6, 0], [-.6, .8, -.3], 15, 4.6, LP);
lilac([1, -4.6, 0], [.62, .78, -.25], 15, 4.2, LQ);
lilac([0, -4.6, -1], [0, .85, -.5], 15, 4, LP);

// ================================
// LILY OF THE VALLEY
// ================================

lily([-.5, -5, .5], [-12, 14, 5], [-13, 3, 8]);
lily([.5, -5, .5], [11, 15, 6], [12, 4, 8]);
lily([0, -5, 1], [2, 16, 12], [3, 2, 13]);

// ================================
// ROSES
// ================================

rose(
    [0, 7.5, 1],
    5.5,
    [rgb("#4a0614"), rgb("#c8173f"), rgb("#ff8a9c")]
);

rose(
    [-5.5, 4, 3],
    4.8,
    [rgb("#7a1a45"), rgb("#e8608f"), rgb("#ffd0df")]
);

rose(
    [5.5, 4, 2.5],
    4.8,
    [rgb("#8a3320"), rgb("#f08a60"), rgb("#ffe0c8")]
);

rose(
    [.5, 3, 6.5],
    4.3,
    [rgb("#7a1a45"), rgb("#e8608f"), rgb("#ffd0df")]
);

// ================================
// ASCII RENDERER
// ================================

const ramp = " .:-=+*#%@";
const N = W * H;

const zb = new Float32Array(N);
const ch = new Array(N);
const cl = new Int32Array(N);

const LX = -.45, LY = .65, LZ = .6;
const LL = Math.hypot(LX, LY, LZ);

const star = Array.from({ length: N }, () => rnd() < .02);

let yaw = .5;
let pitch = .28;
let drag = null;

const calm = matchMedia(
    "(prefers-reduced-motion: reduce)"
).matches;

const out = document.getElementById("a");
const hexc = new Map();

const hexOf = v => {
    let s = hexc.get(v);

    if (!s) {
        s = "#" + (v | 0x1000000).toString(16).slice(1);
        hexc.set(v, s);
    }

    return s;
};

const q8 = x =>
    Math.min(255, Math.max(0, x | 0)) >> 3 << 3;

// ================================
// DRAW FUNCTION
// ================================

function draw() {
    const cy = Math.cos(yaw);
    const sy = Math.sin(yaw);
    const cp = Math.cos(pitch);
    const sp = Math.sin(pitch);

    const R = (x, y, z) => {
        const a = x * cy + z * sy;
        const b = -x * sy + z * cy;

        return [
            a,
            y * cp - b * sp,
            y * sp + b * cp
        ];
    };

    zb.fill(-1e9);

    for (const q of pts) {
        const [x, y, z] = R(q[0], q[1], q[2]);

        const k = D / (D - z);

        const px = W / 2 + x * k * SX;
        const py = H / 2 - (y + 2.4) * k * SY;

        const rho = q[6];
        const rx = rho * k * SX;
        const ry = rho * k * SY;

        const n = q[10] ? R(q[3], q[4], q[5]) : null;

        for (
            let yy = Math.ceil(py - ry - .5);
            yy <= Math.floor(py + ry - .5);
            yy++
        ) {
            if (yy < 0 || yy >= H) continue;

            const dy = (yy + .5 - py) / ry;

            for (
                let xx = Math.ceil(px - rx - .5);
                xx <= Math.floor(px + rx - .5);
                xx++
            ) {
                if (xx < 0 || xx >= W) continue;

                const dx = (xx + .5 - px) / rx;
                const d2 = dx * dx + dy * dy;

                if (d2 > 1) continue;

                const dz = Math.sqrt(1 - d2);
                const zd = z + dz * rho;

                const i = yy * W + xx;

                if (zd <= zb[i]) continue;

                let a = dx;
                let b = -dy;
                let c = dz;

                if (n) {
                    a = dx * .5 + n[0] * 1.1;
                    b = -dy * .5 + n[1] * 1.1;
                    c = dz * .5 + n[2] * 1.1;
                }

                const lit =
                    (a * LX + b * LY + c * LZ) /
                    (Math.hypot(a, b, c) || 1) / LL;

                let I = .2 + .9 * Math.max(0, lit);

                I *= .76 + .24 *
                    Math.min(1, Math.max(0, (z + 16) / 32));

                const spc = lit > .8 ? (lit - .8) * 260 : 0;
                const f = .28 + .8 * I;

                zb[i] = zd;

                ch[i] = ramp[
                    Math.max(1, Math.min(9, Math.floor(I * 9.5)))
                ];

                cl[i] =
                    (q8(q[7] * f + spc) << 16) |
                    (q8(q[8] * f + spc) << 8) |
                    q8(q[9] * f + spc);
            }
        }
    }

    // Build output efficiently

    let s = "";

    for (let y = 0; y < H; y++) {
        let cur = -1;

        for (let x = 0; x < W; x++) {
            const i = y * W + x;
            const bg = zb[i] < -1e8;

            const v = bg ? 0x2a2f55 : cl[i];
            const c = bg
                ? (star[i] ? "." : " ")
                : ch[i];

            if (v !== cur) {
                if (cur >= 0) s += "</span>";

                s += `<span style="color:${hexOf(v)}">`;
                cur = v;
            }

            s += c;
        }

        s += "</span>\n";
    }

    out.innerHTML = s;
}

// ================================
// ANIMATION MANAGEMENT
// ================================

let rafId = null;

function loop() {
    rafId = null;

    if (document.hidden) return;

    if (!drag && !calm) {
        yaw += .008;
    }

    draw();

    if (!calm) {
        rafId = requestAnimationFrame(loop);
    }
}

function startAnimation() {
    if (document.hidden || calm || rafId !== null) return;

    rafId = requestAnimationFrame(loop);
}

function stopAnimation() {
    if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
    }
}

// ================================
// MOUSE AND TOUCH CONTROLS
// ================================

out.addEventListener("pointerdown", e => {
    drag = [e.clientX, e.clientY];

    out.setPointerCapture(e.pointerId);
    out.style.cursor = "grabbing";

    stopAnimation();
});

out.addEventListener("pointermove", e => {
    if (!drag) return;

    yaw += (e.clientX - drag[0]) * .01;

    pitch = Math.max(
        -.2,
        Math.min(
            .9,
            pitch + (e.clientY - drag[1]) * .006
        )
    );

    drag = [e.clientX, e.clientY];

    draw();
});

function endDrag() {
    if (!drag) return;

    drag = null;
    out.style.cursor = "grab";

    if (!document.hidden) {
        if (calm) {
            draw();
        } else {
            startAnimation();
        }
    }
}

out.addEventListener("pointerup", endDrag);
out.addEventListener("pointercancel", endDrag);
out.addEventListener("lostpointercapture", endDrag);

// ================================
// RESPONSIVE SIZING
// ================================

function fit() {
    const widthSize = innerWidth / (W * .6);
    const heightSize = Math.max(4, (innerHeight - 50) / H);

    const fontSize = Math.max(
        4,
        Math.min(18, widthSize, heightSize)
    );

    out.style.fontSize = fontSize + "px";
}

window.addEventListener("resize", fit);

// ================================
// TAB VISIBILITY
// ================================

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        stopAnimation();
    } else {
        draw();
        startAnimation();
    }
});

// ================================
// INITIALIZATION
// ================================

fit();
draw();
startAnimation();

</script>
</body>
</html>
