<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouquet for a Tuxedo Cat</title>
<style>
html,body{margin:0;height:100%;background:#0a0b17}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
pre{margin:0;font:700 10px/1 "Courier New",ui-monospace,monospace}
p{margin:.7em;font:13px Georgia,serif;font-style:italic;color:#7a7da6}
</style>
</head>
<body>
<pre id="a" aria-label="Colored ASCII art of a bouquet of lily of the valley, roses and lilac with a tuxedo cat behind it"></pre>
<p>lily of the valley, rose, lilac, and a tuxedo cat keeping watch</p>
<script>
const W=100,H=50;
const rnd=(()=>{let a=7;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}})();
const g=Array.from({length:H},()=>Array.from({length:W},()=>({c:' ',k:'#0a0b17'})));
const P=(x,y,c,k,cat)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<W&&y>=0&&y<H)g[y][x]={c,k,cat}};
const pick=a=>a[Math.floor(rnd()*a.length)];
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{a=hx(a);b=hx(b);t=Math.max(0,Math.min(1,t));return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
// filled ellipse; callback gets x,y,distance(0-1),u,v
const E=(cx,cy,rx,ry,f)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const u=(x-cx)/rx,v=(y-cy)/ry,d=u*u+v*v;if(d<=1)f(x,y,Math.sqrt(d),u,v)}};
// filled triangle
const T=(p,q,r,f)=>{const s=(a,b,c)=>(a[0]-c[0])*(b[1]-c[1])-(b[0]-c[0])*(a[1]-c[1]);
for(let y=Math.min(p[1],q[1],r[1]);y<=Math.max(p[1],q[1],r[1]);y++)for(let x=Math.min(p[0],q[0],r[0]);x<=Math.max(p[0],q[0],r[0]);x++){const o=[x,y],a=s(o,p,q),b=s(o,q,r),c=s(o,r,p);if(!((a<0||b<0||c<0)&&(a>0||b>0||c>0)))f(x,y)}};
const B=(p,c,q,t)=>[(1-t)**2*p[0]+2*(1-t)*t*c[0]+t*t*q[0],(1-t)**2*p[1]+2*(1-t)*t*c[1]+t*t*q[1]];
const sl=(dx,dy)=>{const r=Math.abs(dy)/(Math.abs(dx)*.5+1e-9);return r>2.5?'|':r<.4?'-':dx*dy<0?'/':'\\'};
const curve=(p,c,q,t0,t1,k)=>{let l=B(p,c,q,t0);for(let t=t0+.01;t<=t1;t+=.01){const n=B(p,c,q,t);P(n[0],n[1],sl(n[0]-l[0],n[1]-l[1]),k);l=n}};

// ---- night sky + moon
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(rnd()<.025)P(x,y,pick(['.','+','*']),mix('#2a2f55','#8890c0',rnd()));
E(50,15,33,17,(x,y,d)=>{if(rnd()<.12)P(x,y,'.',mix('#3a3a66','#14152a',d))});
E(50,15,26,13,(x,y,d)=>P(x,y,d>.85?'.':pick(['.',':','o',"'"]),mix('#f6eab0','#6b6540',d*1.1)));

// ---- tuxedo cat
const K='#262842',WH='#f3f3f8';
const cp=(x,y,w)=>P(x,y,w?pick(['@','0','O']):pick(['#','#','%','@']),w?WH:K,1);
curve0=null;
for(let t=0;t<=1;t+=.012){const[x,y]=B([64,38],[88,42],[82,19],t);E(x,y,3.4,1.7,(a,b)=>cp(a,b))}
E(50,35,18,14,(x,y)=>cp(x,y));
E(50,17,13,8,(x,y)=>cp(x,y));
T([37,12],[38,3],[46,9],(x,y)=>cp(x,y));T([63,12],[62,3],[54,9],(x,y)=>cp(x,y));
T([39,10],[39,6],[43,9],(x,y)=>P(x,y,'*','#e79bb5',1));T([61,10],[61,6],[57,9],(x,y)=>P(x,y,'*','#e79bb5',1));
T([50,10],[48,18],[52,18],(x,y)=>cp(x,y,1));
E(50,22,6,3.2,(x,y)=>cp(x,y,1));
E(50,30,6,6,(x,y)=>cp(x,y,1));
[44,56].forEach(x=>{E(x,15,2.6,1.3,(a,b)=>P(a,b,'O','#8ef06a',1));P(x,15,'|','#0b0b14',1)});
P(50,20,'v','#f08aa8',1);P(49,22,'\\','#8a8ca8',1);P(51,22,'/','#8a8ca8',1);
for(let i=0;i<9;i++)[19,21].forEach(y=>{P(38-i,y,'-','#b7bbd8');P(62+i,y,'-','#b7bbd8')});
// rim light so the black coat reads against the night
g.forEach((r,y)=>r.forEach((c,x)=>{if(c.cat&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>!(g[y+b]&&g[y+b][x+a]&&g[y+b][x+a].cat)))c.k=c.k===WH?'#c9ccee':'#7b82b8'}));

// ---- bouquet: stems, paper
[[36,32],[64,32],[50,34],[40,35],[60,35],[30,33],[70,33]].forEach(([tx,ty])=>{let l=[50,46];for(let t=.02;t<=1;t+=.02){const n=[50+(tx-50)*t,46+(ty-46)*t];P(n[0],n[1],sl(n[0]-l[0],n[1]-l[1]),'#3f8f4a');l=n}});
T([32,36],[68,36],[50,50],(x,y)=>P(x,y,(x+y)%7===0?'/':pick(['#','=','%']),mix('#e0bb85','#8a6a3d',Math.abs(x-50)/22+(y-36)/30)));
for(let x=32;x<=68;x++)P(x,36,'_','#f0d9a8');

// ---- leaves
const leaf=(x,y,L,a,c)=>{for(let t=0;t<=1;t+=.02){const px=x+Math.cos(a)*L*t*2,py=y+Math.sin(a)*L*t,w=Math.sin(Math.PI*t)*L*.28;for(let s=-w;s<=w;s+=.5)P(px-Math.sin(a)*s*2,py+Math.cos(a)*s,Math.abs(s)<.3?'/':pick(['%','&','#']),Math.abs(s)<.3?c[2]:mix(c[0],c[1],rnd()))}};
const G=['#1f5a35','#3b8f52','#7fd08a'];
leaf(46,37,16,-2.55,G);leaf(54,37,16,-.59,G);leaf(44,36,12,-2.0,G);leaf(56,36,12,-1.14,G);leaf(36,35,9,-2.9,G);leaf(64,35,9,-.24,G);

// ---- lilac
const lilac=(x0,y0,x1,y1,pal)=>{for(let i=0;i<=16;i++){const t=i/16,r=4.6*(1-t)+1.1;E(x0+(x1-x0)*t,y0+(y1-y0)*t,r*2,r,(x,y,d)=>{if(rnd()<.82)P(x,y,pick(['*','*','o','O','+','@']),mix(pick(pal),'#ffffff',(rnd()-.5)*.35+(1-d)*.1))})}};
lilac(40,35,24,12,['#b57edc','#c9a0ea','#9d6bd6','#dcbdf4','#8a55c4']);
lilac(60,35,76,12,['#cdb4f0','#e3d1f8','#b999e6','#a47fdc']);

// ---- lily of the valley
const lily=(p,c,q)=>{curve(p,c,q,0,1,'#4aa55a');let i=0;for(let t=.5;t<=.98;t+=.055,i++){const[x,y]=B(p,c,q,t),s=i%2?1:-1;
if(t>.9){P(x+s,y+1,'.','#e8f3e0');continue}
P(x+s,y+.6,',','#4aa55a');P(x+s*2,y+1.5,'o',mix('#ffffff','#d9ecd6',rnd()*.5));P(x+s*2,y+2.5,'u','#e6f0e0')}};
lily([45,36],[14,18],[12,35]);
lily([55,36],[86,18],[88,35]);
lily([47,36],[30,6],[28,30]);

// ---- roses (spiral petals)
const rose=(cx,cy,r,[dk,md,lt])=>E(cx,cy,r*2,r,(x,y,d,u,v)=>{const s=(d*3.2+Math.atan2(v,u)/(2*Math.PI)+2)%1,l=1-d*.55-u*.15-v*.2;
if(d<.15)P(x,y,'@',dk);else if(s<.22)P(x,y,pick(['@','&','8']),mix(dk,md,l*.8));else P(x,y,pick(['o','O','0','%']),mix(md,lt,l*1.1-.2))});
rose(36,31,5.2,['#8a1d45','#e8608f','#ffc2d6']);
rose(64,31,5.2,['#9a3a2a','#f08a6a','#ffd9bf']);
rose(50,32,6.4,['#5a0818','#cf1f4a','#ff7a90']);

// ---- ribbon + bow
for(let x=32;x<=68;x++){const hw=18*(50-41)/14;if(Math.abs(x-50)<=hw){P(x,41,'=','#e8467c');P(x,42,'=','#b82b5a')}}
E(46,40,3.4,1.3,(x,y)=>P(x,y,'@','#ff5c94'));E(54,40,3.4,1.3,(x,y)=>P(x,y,'@','#ff5c94'));
P(50,41,'O','#ffd0e0');P(49,43,'\\','#ff5c94');P(48,44,'\\','#ff5c94');P(51,43,'/','#ff5c94');P(52,44,'/','#ff5c94');

// ---- render
const esc=c=>c==='&'?'&amp;':c==='<'?'&lt;':c;
document.getElementById('a').innerHTML=g.map(r=>{let o='',k=null,s='';for(const c of r){if(c.k!==k){if(s)o+=`<span style="color:${k}">${s}</span>`;k=c.k;s=''}s+=esc(c.c)}return o+`<span style="color:${k}">${s}</span>`}).join('\n');
const fit=()=>{document.getElementById('a').style.fontSize=Math.min(innerWidth/(W*.6),(innerHeight-50)/H)+'px'};
fit();addEventListener('resize',fit);
</script>
</body>
</html>
